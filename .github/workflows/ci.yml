name: foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fast:
    if: github.ref != 'refs/heads/implementation/ci-reliability' && github.head_ref != 'implementation/ci-reliability'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Formatting, vet, unit, reproducible CGO-free build and inventories
        run: ./hack/test fast
      - name: Race detector (test-only C toolchain; never release build settings)
        run: ./hack/test race
      - name: Bounded hostile native input fuzzing (CGO-free)
        run: ./hack/test fuzz-smoke
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: fast-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  integration:
    if: github.ref != 'refs/heads/implementation/ci-reliability' && github.head_ref != 'implementation/ci-reliability'
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: PG18 F+D2 recovery, actual MinIO and shell-free image regressions
        run: ./hack/test integration --seed 1806 --images
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: integration-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
