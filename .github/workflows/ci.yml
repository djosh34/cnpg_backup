name: foundation
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  fast:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Formatting, vet, unit, reproducible CGO-free build and inventories
        run: ./hack/test fast
      - name: Race detector (test-only C toolchain; never release build settings)
        env:
          CGO_ENABLED: '1'
          GOTOOLCHAIN: local
        run: |
          export CNPG_PROMTOOL="$(python3 hack/test_tools.py)"
          .work/tools/go/bin/go test -race -count=1 -timeout=120s ./...
      - name: Bounded hostile native input fuzzing (CGO-free)
        env:
          CGO_ENABLED: '0'
          GOTOOLCHAIN: local
          GOMAXPROCS: '2'
        run: |
          set -euo pipefail
          for target in FuzzNativeManifest FuzzNativeArchive; do
            .work/tools/go/bin/go test -json ./internal/postgres -run '^$' -fuzz "^${target}$" -fuzztime=30s -parallel=2 -timeout=90s \
              | tee "artifacts/fast/${target}.jsonl"
          done
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: fast-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
  integration:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: PG18 F+D2 recovery, actual MinIO and shell-free image regressions
        run: ./hack/test integration --seed 1806 --images
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: integration-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
