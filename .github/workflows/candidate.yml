name: exact-candidate
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: candidate-${{ github.sha }}
  cancel-in-progress: false
jobs:
  subject:
    if: github.repository == 'djosh34/cnpg_backup' && github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    permissions:
      contents: read
      packages: write
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.work/registry-auth/.docker
      GOMAXPROCS: '2'
    outputs:
      sha: ${{ steps.subject.outputs.sha }}
      manager: ${{ steps.publish.outputs.manager }}
      pg18: ${{ steps.publish.outputs.pg18 }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.14.3'
      - name: Check publication safety before downloading build inputs
        run: ./hack/test harness test_candidate
      - name: Private ephemeral package authentication
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Verify trusted main checkout and refuse existing candidate tags
        id: subject
        run: python3 hack/candidate.py preflight
      - name: Build exact source and audit actual images
        run: |
          ./hack/test fast
          python3 hack/images.py
      - name: Publish audited images and record canonical manifest digests
        id: publish
        run: python3 hack/candidate.py publish
      - name: Remove ephemeral registry login
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: candidate-${{ github.sha }}-${{ github.run_attempt }}
          path: |
            artifacts/candidate/
            artifacts/fast/
            build/out/images.json
            build/out/go-*.json
            build/out/go-version.txt
            build/out/*-export.json
            build/out/*-inspect.json
          retention-days: 14
          if-no-files-found: error
  security:
    needs: subject
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/security.yml
    with:
      subject_sha: ${{ needs.subject.outputs.sha }}
      manager_image: ${{ needs.subject.outputs.manager }}
      data_image: ${{ needs.subject.outputs.pg18 }}
      trusted_ref: main
  recovery:
    needs: subject
    permissions:
      contents: read
      packages: read
    uses: ./.github/workflows/recovery-campaign.yml
    with:
      subject_sha: ${{ needs.subject.outputs.sha }}
      manager_image: ${{ needs.subject.outputs.manager }}
      data_image: ${{ needs.subject.outputs.pg18 }}
      trusted_ref: main
      seeds: '[1806]'
