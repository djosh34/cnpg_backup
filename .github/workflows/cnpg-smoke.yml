name: real-cnpg-lifecycle-smoke
on:
  push:
    paths: ['internal/**', 'cmd/**', 'config/**', 'hack/**', 'go.mod', 'go.sum', 'build/**', '.github/workflows/cnpg-smoke.yml']
  pull_request:
    paths: ['internal/**', 'cmd/**', 'config/**', 'hack/**', 'go.mod', 'go.sum', 'build/**', '.github/workflows/cnpg-smoke.yml']
permissions:
  contents: read
jobs:
  cnpg-smoke:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Real pinned kind/CNPG/cert-manager install, two instances, restart and leaf rotation
        run: ./hack/test cnpg-smoke
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        if: always()
        with:
          name: real-cnpg-smoke-${{ github.sha }}-${{ github.run_attempt }}
          path: artifacts/
          if-no-files-found: error
          retention-days: 14
