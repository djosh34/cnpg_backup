name: digest-only recovery recipe
on:
  workflow_dispatch:
    inputs:
      subject_sha:
        description: Exact published subject commit
        required: true
        type: string
      manager_image:
        description: Canonical immutable manager digest
        required: true
        type: string
      data_image:
        description: Canonical immutable data digest
        required: true
        type: string
      trusted_ref:
        type: choice
        options: [main]
        default: main
      prior_release:
        description: Optional recorded version tag from trusted main; blank for candidates
        type: string
        default: ''
      seeds:
        type: string
        default: '[1806]'
      profile:
        type: choice
        options: [recovery]
        default: recovery
  workflow_call:
    inputs:
      subject_sha:
        required: true
        type: string
      manager_image:
        required: true
        type: string
      data_image:
        required: true
        type: string
      trusted_ref:
        type: string
        default: main
      prior_release:
        type: string
        default: ''
      seeds:
        type: string
        default: '[1806]'
      profile:
        type: string
        default: recovery
permissions:
  contents: read
  packages: read
jobs:
  bundle:
    if: github.repository == 'djosh34/cnpg_backup' && github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    outputs:
      matrix: ${{ steps.plan.outputs.matrix }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.14.3'
      - name: Verify repository-owned subject and freeze exact repeat recipes
        id: plan
        env:
          SUBJECT_SHA: ${{ inputs.subject_sha }}
          MANAGER_IMAGE: ${{ inputs.manager_image }}
          DATA_IMAGE: ${{ inputs.data_image }}
          TRUSTED_REF: ${{ inputs.trusted_ref }}
          PRIOR_RELEASE: ${{ inputs.prior_release }}
          SEEDS: ${{ inputs.seeds }}
          PROFILE: ${{ inputs.profile }}
        run: |
          python3 hack/campaign_ci.py prepare
          ./hack/test harness
          ./hack/test race
          ./hack/test fuzz-smoke
          ./hack/test campaign-focused
          ./hack/test campaign-bundle --out .work/campaign-bundle
          python3 hack/campaign_ci.py plans
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: immutable-harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            .work/campaign-bundle/
            artifacts/campaign-inputs/
            artifacts/fast/
          include-hidden-files: true
          retention-days: 14
          if-no-files-found: error
  run:
    needs: bundle
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.bundle.outputs.matrix) }}
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      DOCKER_CONFIG: ${{ github.workspace }}/.work/registry-auth
      ATTEMPT: ${{ matrix.attempt }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.14.3'
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: immutable-harness-${{ github.run_id }}-${{ github.run_attempt }}
      - name: Restore only executable permissions lost by artifact transport
        run: chmod 555 .work/campaign-bundle/{actor,minio,wal-proxy,wal-client,verify}
      - name: Ephemeral read-only package authentication
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p "$DOCKER_CONFIG"
          chmod 700 "$DOCKER_CONFIG"
          printf '%s' "$REGISTRY_TOKEN" | docker login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
      - name: Run the local digest-only recipe with fresh fixtures
        run: |
          ./hack/test recovery-campaign --plan "artifacts/campaign-inputs/plan-$ATTEMPT.json" \
            --bundle .work/campaign-bundle --run-dir ".work/campaign-run-$ATTEMPT" --duration-minutes 120
      - name: Publish only bounded evidence, never private runtime inputs
        if: always()
        run: |
          python3 hack/campaign_ci.py collect
      - name: Remove ephemeral registry credentials even when collection fails
        if: always()
        run: rm -rf -- "$DOCKER_CONFIG"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: campaign-attempt-${{ matrix.attempt }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/campaign-results/
          retention-days: 14
          if-no-files-found: error
  aggregate:
    if: always()
    needs: [bundle, run]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: campaign-attempt-*
          path: .work/results
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: immutable-harness-${{ github.run_id }}-${{ github.run_attempt }}
          path: .work/inputs
      - name: Exact attempts, all failures, no partial or retained acceptance
        run: python3 hack/campaign_ci.py aggregate
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        if: always()
        with:
          name: campaign-aggregate-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/campaign-aggregate.json
          retention-days: 14
          if-no-files-found: error
