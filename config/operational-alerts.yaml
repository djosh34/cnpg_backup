# Uses the manager scrape configured in backup-monitoring.yaml.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-backup-operations
spec:
  groups:
    - name: cnpg-backup-operations
      rules:
        - alert: CNPGBackupRetentionBlocked
          expr: cnpg_backup_retention_blocked == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Retention is blocked
            description: Inspect Repository conditions and holders. Do not remove uncertain holders.
        - alert: CNPGBackupRepositoryAdmissionBlocked
          expr: cnpg_backup_repository_admission_blocked == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: A GC owner blocks new backups and restores
        - alert: CNPGBackupRetentionWorkspacePressure
          expr: cnpg_backup_retention_workspace_available == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Retention workspace reservation failed
        - alert: CNPGBackupRestoreUncertain
          expr: cnpg_backup_restore_uncertain == 1
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Restore termination is uncertain
            description: Source backups remain protected. Retry with a fresh Cluster and fresh target PVCs.
        - alert: CNPGBackupRestoreObservationUnknown
          expr: cnpg_backup_restore_observation_known == 0
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Restore state is unknown or stale
        - alert: CNPGBackupRestoreLifetimeReleasePending
          expr: cnpg_backup_restore_lifetime_release_pending == 1
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Completed restore still holds source deletion protection
            description: Inspect source credentials and Repository admission.
