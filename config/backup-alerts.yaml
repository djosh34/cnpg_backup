# Install in a namespace selected by your Prometheus ruleSelector.
# Set backupFreshness thresholds to enable monitoring for each backup type.
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: cnpg-backup
spec:
  groups:
    - name: cnpg-backup
      rules:
        - alert: CNPGBackupFullNeverSuccessful
          expr: (cnpg_backup_success_history_known{backup_type="full"} == 1 and on(repository_id,namespace,cluster,backup_type) cnpg_backup_freshness_max_age_seconds{backup_type="full"} > 0) unless on(repository_id,namespace,cluster,backup_type) cnpg_backup_last_success_timestamp_seconds{backup_type="full"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: No successful full backup
        - alert: CNPGBackupDifferentialNeverSuccessful
          expr: (cnpg_backup_success_history_known{backup_type="differential"} == 1 and on(repository_id,namespace,cluster,backup_type) cnpg_backup_freshness_max_age_seconds{backup_type="differential"} > 0) unless on(repository_id,namespace,cluster,backup_type) cnpg_backup_last_success_timestamp_seconds{backup_type="differential"}
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: No successful differential backup
        - alert: CNPGBackupFullStale
          expr: (time() - cnpg_backup_last_success_timestamp_seconds{backup_type="full"} > on(repository_id,namespace,cluster,backup_type) cnpg_backup_freshness_max_age_seconds{backup_type="full"}) and on(repository_id,namespace,cluster,backup_type) (cnpg_backup_success_history_known{backup_type="full"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Last full backup exceeds the configured maximum age
        - alert: CNPGBackupDifferentialStale
          expr: (time() - cnpg_backup_last_success_timestamp_seconds{backup_type="differential"} > on(repository_id,namespace,cluster,backup_type) cnpg_backup_freshness_max_age_seconds{backup_type="differential"}) and on(repository_id,namespace,cluster,backup_type) (cnpg_backup_success_history_known{backup_type="differential"} == 1)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Last differential backup exceeds the configured maximum age
        - alert: CNPGBackupFullFailing
          expr: (increase(cnpg_backup_failures_total{backup_type="full"}[15m]) > 0) and on(repository_id,namespace,cluster,backup_type) (cnpg_backup_freshness_max_age_seconds{backup_type="full"} > 0)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Full backup failed
            description: Inspect CNPG Backup status.
        - alert: CNPGBackupDifferentialFailing
          expr: (increase(cnpg_backup_failures_total{backup_type="differential"}[15m]) > 0) and on(repository_id,namespace,cluster,backup_type) (cnpg_backup_freshness_max_age_seconds{backup_type="differential"} > 0)
          for: 1m
          labels:
            severity: warning
          annotations:
            summary: Differential backup failed
            description: Inspect CNPG Backup status. The plugin does not fall back to a full backup.
        - alert: CNPGBackupFullHistoryUnknown
          expr: (cnpg_backup_success_history_known{backup_type="full"} == 0) and on(repository_id,namespace,cluster,backup_type) (cnpg_backup_freshness_max_age_seconds{backup_type="full"} > 0)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Full backup history is unavailable
            description: Check repository storage and credentials.
        - alert: CNPGBackupDifferentialHistoryUnknown
          expr: (cnpg_backup_success_history_known{backup_type="differential"} == 0) and on(repository_id,namespace,cluster,backup_type) (cnpg_backup_freshness_max_age_seconds{backup_type="differential"} > 0)
          for: 5m
          labels:
            severity: warning
          annotations:
            summary: Differential backup history is unavailable
            description: Check repository storage and credentials.
